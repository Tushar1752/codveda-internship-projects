<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Basic counter application using JavaScript DOM manipulation">

    <title>Tushar Verma | Counter App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="counter-container">

            <div class="logo">
                TV
            </div>

            <p class="label">
                JAVASCRIPT PROJECT
            </p>

            <h1>
                Counter App
            </h1>

            <p class="description">
                A simple counter application demonstrating
                JavaScript DOM manipulation.
            </p>

            <div class="counter-display">
                <span id="count">0</span>
            </div>

            <div class="buttons">

                <button id="decrementBtn" class="btn decrement" type="button">
                    −
                </button>

                <button id="resetBtn" class="btn reset" type="button">
                    Reset
                </button>

                <button id="incrementBtn" class="btn increment" type="button">
                    +
                </button>

            </div>

            <p class="status" id="status">
                Counter is ready
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
